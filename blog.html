<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYLs Treasures Blog</title>
    <style>
        body {
            background-color: #9b7fb8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #9b7fb8;
            margin-bottom: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .subscribe-btn {
            background-color: #9b7fb8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        .subscribe-btn:hover {
            background-color: #8b6fa8;
        }

        .post {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 0;
        }

        .post:last-child {
            border-bottom: none;
        }

        .date {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .post-title {
            margin: 0 0 10px;
        }

        .post-title a {
            color: #333;
            text-decoration: none;
        }

        .post-title a:hover {
            color: #9b7fb8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #9b7fb8;
            text-decoration: none;
            font-weight: 600;
        }

        /* Subscribe Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .modal-box h2 {
            color: #9b7fb8;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            color: #999;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #333;
        }

        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subscribe-form input[type="email"] {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .subscribe-form input[type="email"]:focus {
            outline: none;
            border-color: #9b7fb8;
        }

        .subscribe-form button {
            background-color: #9b7fb8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .subscribe-form button:hover {
            background-color: #8b6fa8;
        }

        .subscribe-message {
            margin-top: 14px;
            font-size: 13px;
            color: #2e7d32;
            display: none;
        }

        .subscribe-message.error {
            color: #c62828;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="header-row">
            <div>
                <h1>Blog</h1>
                <p>Browse every post from JYLs Treasures.</p>
            </div>
            <button type="button" class="subscribe-btn" id="open-subscribe-btn">Subscribe</button>
        </div>
        <div id="all-posts-list"></div>
        <a class="back-link" href="index.html">← Back to Home</a>
    </main>

    <!-- Subscribe Modal -->
    <div class="modal-overlay" id="subscribe-modal">
        <div class="modal-box">
            <button type="button" class="modal-close" id="close-subscribe-btn" aria-label="Close">&times;</button>
            <h2>Subscribe to our Blog</h2>
            <p>Get new posts from JYLs Treasures delivered straight to your inbox.</p>
            <form class="subscribe-form" id="subscribe-form">
                <input type="email" id="subscribe-email" name="email" placeholder="Enter your email address" required>
                <button type="submit">Subscribe</button>
            </form>
            <div class="subscribe-message" id="subscribe-message"></div>
        </div>
    </div>

    <script src="blog-posts.js"></script>
    <script>
        (function renderBlogPage() {
            const allPostsContainer = document.getElementById('all-posts-list');
            if (!allPostsContainer || !Array.isArray(window.BLOG_POSTS)) {
                return;
            }

            const sortedPosts = [...window.BLOG_POSTS]
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            allPostsContainer.innerHTML = sortedPosts.map((post) => `
                <article class="post">
                    <div class="date">${post.displayDate}</div>
                    <h2 class="post-title"><a href="post.html?slug=${post.slug}">${post.title}</a></h2>
                    <p>${post.excerpt}</p>
                </article>
            `).join('');
        })();

        (function setupSubscribeModal() {
            const modal = document.getElementById('subscribe-modal');
            const openBtn = document.getElementById('open-subscribe-btn');
            const closeBtn = document.getElementById('close-subscribe-btn');
            const form = document.getElementById('subscribe-form');
            const emailInput = document.getElementById('subscribe-email');
            const message = document.getElementById('subscribe-message');

            function openModal() {
                modal.classList.add('open');
                message.style.display = 'none';
                message.classList.remove('error');
                emailInput.focus();
            }

            function closeModal() {
                modal.classList.remove('open');
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);

            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal.classList.contains('open')) {
                    closeModal();
                }
            });

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const email = emailInput.value.trim();

                if (!email) {
                    return;
                }

                // TODO: Replace this with a real email subscription service
                // (e.g., Mailchimp, ConvertKit, Formspree, Buttondown) by
                // sending `email` to that service's API/endpoint here.
                console.log('New subscriber:', email);

                message.textContent = "Thanks for subscribing! We'll keep you posted.";
                message.classList.remove('error');
                message.style.display = 'block';
                form.reset();

                setTimeout(closeModal, 2000);
            });
        })();
    </script>
</body>
</html>
