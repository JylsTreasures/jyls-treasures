<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYLs Treasures Blog</title>
    <style>
        body {
            background-color: #9b7fb8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #9b7fb8;
            margin-bottom: 10px;
        }

        .post {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 0;
        }

        .post:last-child {
            border-bottom: none;
        }

        .date {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .post-title {
            margin: 0 0 10px;
        }

        .post-title a {
            color: #333;
            text-decoration: none;
        }

        .post-title a:hover {
            color: #9b7fb8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #9b7fb8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Blog</h1>
        <p>Browse every post from JYLs Treasures.</p>
        <div id="all-posts-list"></div>
        <a class="back-link" href="index.html">← Back to Home</a>
    </main>

    <script src="blog-posts.js"></script>
    <script>
        (function renderBlogPage() {
            const allPostsContainer = document.getElementById('all-posts-list');
            if (!allPostsContainer || !Array.isArray(window.BLOG_POSTS)) {
                return;
            }

            const sortedPosts = [...window.BLOG_POSTS]
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            allPostsContainer.innerHTML = sortedPosts.map((post) => `
                <article class="post">
                    <div class="date">${post.displayDate}</div>
                    <h2 class="post-title"><a href="post.html?slug=${post.slug}">${post.title}</a></h2>
                    <p>${post.excerpt}</p>
                </article>
            `).join('');
        })();
    </script>
</body>
</html>
